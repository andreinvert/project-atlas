<script>
function b64ToBytes(b64){
  var s = atob(b64), n = s.length, a = new Uint8Array(n);
  for (var i = 0; i < n; i++) a[i] = s.charCodeAt(i);
  return a;
}
async function unlock(){
  var pwEl = document.getElementById('pw'), err = document.getElementById('err'), go = document.getElementById('go');
  err.style.display = 'none'; go.disabled = true; go.textContent = 'Unlocking...';
  try {
    var data = JSON.parse(document.getElementById('payload').textContent);
    var keyMat = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwEl.value), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64ToBytes(data.salt), iterations:data.iter, hash:'SHA-256'}, keyMat, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var ptBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToBytes(data.iv)}, key, b64ToBytes(data.ct));
    var html = new TextDecoder().decode(ptBuf);
    document.open(); document.write(html); document.close();
  } catch(e){
    err.style.display = 'block'; go.disabled = false; go.textContent = 'Unlock';
  }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') unlock(); });
document.getElementById('pw').focus();
</script>
